spring.application.name=cloud-hotel-bff

# Cambiar el puerto interno del contenedor al estándar de Spring
server.port=${PORT:8080}

# Host dinámico inyectado desde el pipeline
app.public-host=${PUBLIC_HOST_URL:http://localhost:8080}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Cognito: mismo pool que usa el frontend (us-east-1_rf0QM9OSc)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_rf0QM9OSc}

# Secreto que inyecta el API Gateway en la cabecera X-Secret-Gateway.
# Sin default a proposito: si falta, la app no arranca y el error es explicito.
app.gateway.secret=${API_GATEWAY_SECRET}

# Secreto que el BFF envía a ms-hotel-rooms. Si no se define, se usa el mismo
# que entra desde el API Gateway (un solo secreto para toda la cadena).
app.rooms.gateway.secret=${ROOMS_GATEWAY_SECRET:${app.gateway.secret}}

# Topic SNS de reservas
# SNS hotel-reservation-events -> SQS reservation-requests  -> Lambda reservation-recorder
#                          -> SQS reservation-status        -> Lambda reservation-status-updater
aws.sns.reservation-topic-arn=${SNS_RESERVATION_TOPIC_ARN}
aws.region=${AWS_REGION:us-east-1}

# Lambda 'reservation-query': resuelve las lecturas. Es su Function URL completa.
app.lambda.reservations.url=${RESERVATIONS_LAMBDA_URL}

# Microservicio de habitaciones (catálogo). El BFF le delega y devuelve su JSON.
app.rooms.service-url=${ROOMS_SERVICE_URL}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
