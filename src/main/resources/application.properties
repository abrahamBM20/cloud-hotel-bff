spring.application.name=cloud-hotel-bff

server.port=${PORT:8080}
app.public-host=${PUBLIC_HOST_URL:http://localhost:8080}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

# API Gateway injects this header. It is never configured in the frontend.
app.gateway.secret=${API_GATEWAY_SECRET}

aws.sns.reservation-topic-arn=${SNS_RESERVATION_TOPIC_ARN}
aws.region=${AWS_REGION:us-east-1}

app.rooms.service-url=${ROOMS_SERVICE_URL}
