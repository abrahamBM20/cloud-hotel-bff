name: Deploy BFF to EC2 via GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  CONTAINER_NAME: cloud-hotel-bff

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: TARGET_HOST_IP
          script: |
            set -e

            if [ ! -f /swapfile ]; then
              echo "Instancia sin Swap. Creando 2GB..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            if ! command -v docker > /dev/null 2>&1; then
              echo "Docker no está instalado. Iniciando instalación..."
              if command -v apt-get > /dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y docker.io
              elif command -v dnf > /dev/null 2>&1; then
                sudo dnf update -y
                sudo dnf install -y docker
              elif command -v yum > /dev/null 2>&1; then
                sudo yum update -y
                sudo yum install -y docker
              else
                echo "No se encontró apt-get, dnf ni yum; no se puede instalar Docker."
                exit 1
              fi
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            echo '${{ secrets.GH_CR_PAT }}' | sudo docker login ${{ env.REGISTRY }} \
              -u '${{ github.actor }}' --password-stdin

            sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            sudo docker stop ${{ env.CONTAINER_NAME }} || true
            sudo docker rm ${{ env.CONTAINER_NAME }} || true
            sudo docker image prune -f

            sudo docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --add-host=host.docker.internal:host-gateway \
              -p 8080:8080 \
              -e PORT=8080 \
              -e PUBLIC_HOST_URL="http://$TARGET_HOST_IP:8080" \
              -e COGNITO_ISSUER_URI='${{ secrets.COGNITO_ISSUER_URI }}' \
              -e API_GATEWAY_SECRET='${{ secrets.API_GATEWAY_SECRET }}' \
              -e AWS_REGION='${{ secrets.AWS_REGION }}' \
              -e SNS_RESERVATION_TOPIC_ARN='${{ secrets.SNS_RESERVATION_TOPIC_ARN }}' \
              -e RESERVATIONS_LAMBDA_URL='${{ secrets.RESERVATIONS_LAMBDA_URL }}' \
              -e RESERVATIONS_QUERY_TOKEN='${{ secrets.RESERVATIONS_QUERY_TOKEN }}' \
              -e ROOMS_SERVICE_URL='http://host.docker.internal:80' \
              --restart unless-stopped \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            sleep 10
            sudo docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format '{{.Status}}'
            if ! sudo docker ps --filter "name=${{ env.CONTAINER_NAME }}" --filter status=running -q | grep -q .; then
              sudo docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi
        env:
          TARGET_HOST_IP: ${{ vars.TARGET_HOST_IP }}
