plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hotel'
version = '0.0.1-SNAPSHOT'
description = 'cloud-hotel-bff'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    awssdkVersion = '2.29.52'
}

dependencyManagement {
    imports {
        mavenBom "software.amazon.awssdk:bom:${awssdkVersion}"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 1. Spring Security (filtros y autorizaciones)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 2. JWT: validación del token de Cognito (OAuth2 Resource Server)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // 3. DB: el BFF es dueño del esquema de 'reservations' (ddl-auto=update la crea)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // 4. Validaciones de los DTOs de entrada
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 5. SNS: publica las solicitudes de reserva (SNS hotel-reservation-events
    //    -> SQS -> Lambda reservation-recorder). El BOM de AWS SDK v2 ya está importado arriba.
    implementation 'software.amazon.awssdk:sns'

    // 6. JSON para serializar el mensaje SNS
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}

tasks.named('test') {
    useJUnitPlatform()
}
